[project]
name = "expense-tracker-api"
version = "0.1.0"
description = "FastAPI backend for the expense tracker"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.143.2",
    "supabase>=2.33.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
